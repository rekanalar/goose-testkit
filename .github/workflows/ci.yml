name: ci

on:
  push:
    branches: [main]
    # A push that touches only the documents or this file runs no
    # matrix. The next push that changes the code runs it.
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tag: [v2026.3, v2026.4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install the Goose release
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/goose"
          mkdir -p "$dest"
          tag="${{ matrix.tag }}"
          case "$RUNNER_OS" in
            Linux) asset="linux-x64.tar.gz" ;;
            macOS) asset="macos-arm64.tar.gz" ;;
            Windows) asset="windows-x64.zip" ;;
          esac
          # A busy GitHub CDN answers a release download with a 504. The retry rides it out.
          url="https://github.com/aardappel/goose/releases/download/${tag}/goose-${tag}-${asset}"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.zip"
            7z x -y -o"$dest" "$dest/goose.zip" > /dev/null
            exe=$(find "$dest" -type f -name goose.exe | head -1)
          else
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.tar.gz"
            tar -xzf "$dest/goose.tar.gz" -C "$dest"
            exe=$(find "$dest" -type f -name goose | head -1)
          fi
          chmod +x "$exe"
          bindir="$(dirname "$exe")"
          if [ "$RUNNER_OS" = Windows ]; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"
          "$exe" --help | head -3

      - name: Check the entry file
        run: goose check testkit.goose
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the test suite
        timeout-minutes: 10
        run: |
          set -o pipefail
          goose run test/run.goose 2>&1 | tee test-output.txt
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for f in examples/*.goose; do
            echo "--- $f"
            goose run "$f"
          done
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Build the command and run it on the sample suite
        timeout-minutes: 15
        run: |
          set -euo pipefail
          goose build -o "$RUNNER_TEMP/testgen" cmd/testgen.goose
          cd examples/suite
          # The default run must give back the committed file. A checkout
          # may change the line ends on Windows, so compare without them.
          cp test/_gen.goose "$RUNNER_TEMP/gen.before"
          "$RUNNER_TEMP/testgen"
          diff <(tr -d '\r' < "$RUNNER_TEMP/gen.before") <(tr -d '\r' < test/_gen.goose)
          goose run test/run.goose
          "$RUNNER_TEMP/testgen" -run 'math/sum' -count 2
          goose run test/run.goose | grep "left out: 2 by the run filter"
          "$RUNNER_TEMP/testgen" -shard 1/2
          goose run test/run.goose | grep "left out: 0 by the run filter, 1 by the shard"
          "$RUNNER_TEMP/testgen"
          # The faults end with a non-zero exit and name the file and the line.
          faults="$RUNNER_TEMP/faults"
          rm -rf "$faults"
          mkdir -p "$faults/test"
          cd "$faults"
          printf 'testkit::run(t, "a")\nlet s = "open\n' > test/a.goose
          if "$RUNNER_TEMP/testgen" 2> err.txt; then echo "a broken source gave exit 0"; exit 1; fi
          grep -q "test/a.goose:2: a string never ends" err.txt
          printf 'testkit::run(t, "dup")\ntestkit::begin(t, "dup")\n' > test/a.goose
          "$RUNNER_TEMP/testgen" 2> err.txt > /dev/null
          grep -q "the test name dup has 2 call sites" err.txt
          if "$RUNNER_TEMP/testgen" -run 'a"b' 2> err.txt; then echo "a quote in -run gave exit 0"; exit 1; fi
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the fuzz pass
        timeout-minutes: 25
        run: |
          set -euo pipefail
          goose build --debug test/fuzz.goose -o "$RUNNER_TEMP/fuzz-pass"
          # A coverage build finds far more than a blind one. The
          # compiler of Windows has no coverage flag, so it runs blind.
          cov="$("$RUNNER_TEMP/fuzz-pass" cov-path)"
          if [ -n "$cov" ] && [ "${RUNNER_OS:-Linux}" != "Windows" ]; then
            echo "coverage compiler: $cov"
            GOOSE_CC="$cov" goose build --debug test/fuzz.goose -o "$RUNNER_TEMP/fuzz-pass"
          fi
          "$RUNNER_TEMP/fuzz-pass"
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Report the failure
        if: failure()
        run: |
          text=$(tail -c 2000 test-output.txt 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '%0A')
          echo "::error title=The tests failed::${text}"
